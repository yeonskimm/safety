name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 배포 전 검증
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 문법 검사 (worker.js / service-worker.js)
        run: |
          node --check worker.js
          node --check service-worker.js
          echo "문법 OK"

      - name: 법령 KB 구조 검증
        run: python3 tools/validate_kb.py law_kb.json

      - name: 법령 검색 회귀 테스트
        run: node tests/test_retrieve.js

      - name: 답변 조문번호 검증 테스트
        run: node tests/test_verify.js

      - name: 관리자 인증 단위 테스트
        run: node tests/test_admin.js

      - name: 버전 동기화 (APP_VERSION ↔ CACHE_NAME)
        run: |
          python3 - <<'PY'
          import re, sys
          v = re.search(r"APP_VERSION='(v\d+)'", open('index.html', encoding='utf-8').read()).group(1)
          c = re.search(r"onul-safety-(v\d+)", open('service-worker.js', encoding='utf-8').read()).group(1)
          print(f"index.html {v} / service-worker.js {c}")
          sys.exit(0 if v == c else 1)
          PY

      - name: 평문 비밀값 잔존 검사
        run: |
          if grep -nE "safety-admin-[0-9]+|ADMIN_PIN *= *.[0-9]{6}" index.html; then
            echo "평문 비밀값이 남아 있습니다"; exit 1
          fi
          echo "평문 잔존 없음"

      - name: PWA 참조 파일 존재 확인
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          missing = []
          for f in json.load(open('manifest.json', encoding='utf-8')).get('icons', []):
              p = f['src'].lstrip('./')
              if not os.path.exists(p):
                  missing.append(f"manifest.json -> {p}")
          sw = open('service-worker.js', encoding='utf-8').read()
          for p in re.findall(r"'\./([^']+)'", sw):
              if p and not os.path.exists(p):
                  missing.append(f"service-worker.js -> {p}")
          for p in re.findall(r'(?:href|src)="(?!https?:|data:)([^"#?]+)"', open('index.html', encoding='utf-8').read()):
              if not p or any(ch in p for ch in '${}+\''):   # 템플릿 변수·JS 조합 경로는 제외
                  continue
              if not os.path.exists(p.lstrip('./')):
                  missing.append(f"index.html -> {p}")
          if missing:
              print("참조하는데 존재하지 않는 파일:")
              [print('  -', m) for m in missing]
              sys.exit(1)
          print("PWA 참조 파일 이상 없음")
          PY

      - name: 렌더링 테스트 (Playwright)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 tests/test_ui.py
