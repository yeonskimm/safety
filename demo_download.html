<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이미지 저장 데모 · 오늘의안전</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f1f5f9;color:#0f172a}
  .hdr{background:#1e3a5f;color:#fff;padding:16px;text-align:center;font-weight:700}
  .body{padding:16px;max-width:520px;margin:0 auto}
  .preview-img{width:100%;border-radius:10px;border:1px solid #e2e8f0;background:#fff;display:block}
  .dl-btn{width:100%;margin-top:14px;padding:16px;border:0;border-radius:12px;background:#1e3a5f;color:#fff;font-size:16px;font-weight:700}
  .dl-btn:active{opacity:.85}
  .log{margin-top:16px;background:#0f172a;color:#7ee787;font-size:12px;line-height:1.7;
       padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;min-height:120px}
  .note{margin-top:12px;font-size:13px;line-height:1.7;color:#475569;background:#fff;
        padding:12px;border-radius:10px;border:1px solid #e2e8f0}
  .lang{margin-top:10px;text-align:center}
  .lang button{padding:6px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div class="hdr">이미지 저장 데모 (v91 후보)</div>
<div class="body">
  <img class="preview-img" id="prev" alt="샘플 보고서">
  <button class="dl-btn" id="dlbtn" onclick="downloadImg()"></button>
  <div class="lang"><button onclick="toggleLang()">🇰🇷 KO ⇄ EN</button></div>
  <div class="note">
    <b>테스트 방법</b><br>
    ① 아이폰 <b>사파리</b>에서 이 페이지를 열고 버튼 탭 → 공유 시트가 뜨는지 확인<br>
    ② 홈 화면에 추가(PWA)한 뒤 다시 탭 → 동일하게 뜨는지 확인<br>
    ③ 안드로이드·PC에서도 탭 → 파일 저장되는지 확인<br>
    아래 검은 칸에 어느 경로(A/B/C)로 처리됐는지 표시됩니다.
  </div>
  <div class="log" id="log">대기 중…</div>
</div>

<script>
/* ─────────── 데모용 상태 (실제 앱의 state 대체) ─────────── */
var state={lang:'ko',previewUrl:null};
function getDate(){const n=new Date();return n.getFullYear()+"."+String(n.getMonth()+1).padStart(2,"0")+"."+String(n.getDate()).padStart(2,"0")+" "+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");}
function L(m){var el=document.getElementById('log');el.textContent+="\n"+m;}

/* ─────────── ★ 실제 앱에 이식할 코드 시작 ─────────── */

// iOS 판별 (iPadOS 13+ 는 MacIntel 로 위장되므로 터치포인트로 보정)
var _isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
          || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

// 다운로드 버튼 라벨 — iOS/공유지원 기기는 '저장·전송'으로 표기 (실제 동작은 공유 시트)
function dlBtnLabel(ko){
  var canShare = !!(navigator.canShare && navigator.share);
  if(_isIOS || canShare) return ko ? '⬇️ 이미지 저장·전송 (관리감독자 제출용)' : '⬇️ Save / Send Image (For Supervisor)';
  return ko ? '⬇️ 이미지 다운로드 (관리감독자 제출용)' : '⬇️ Download Image (For Supervisor)';
}

// dataURL → Blob 동기 변환 (fetch는 비동기라 iOS에서 사용자 제스처가 끊겨 공유 시트가 차단됨)
function _dataUrlToBlob(dataUrl){
  var parts=dataUrl.split(',');
  var m=parts[0].match(/:(.*?);/);
  var mime=(m&&m[1])||'image/png';
  var bin=atob(parts[1]), len=bin.length, arr=new Uint8Array(len);
  for(var i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

function downloadImg(){
  if(!state.previewUrl) return;
  var ko=state.lang==='ko';
  var fname='안전점검확인서_'+getDate().replace(/[:.\s\/]/g,'-')+'.png';
  var blob=null;
  try{ blob=_dataUrlToBlob(state.previewUrl); }catch(e){ blob=null; L('⚠ Blob 변환 실패: '+e); }

  // ── A. Web Share API : iOS 15+ / 최신 Android → 사진 앱 저장·메신저 전송
  if(blob && navigator.canShare && navigator.share){
    try{
      var file=new File([blob],fname,{type:'image/png'});
      if(navigator.canShare({files:[file]})){
        L('▶ 경로 A: Web Share API 호출');
        navigator.share({files:[file], title: ko?'작업 전 안전 점검 확인서':'Pre-Work Safety Checklist'})
          .then(function(){ L('✅ A 성공 (공유 시트 완료)'); })
          .catch(function(err){
            if(err && err.name==='AbortError'){ L('⏹ A 취소됨 (사용자가 닫음)'); return; }
            L('⚠ A 실패 → B로 폴백: '+(err&&err.name));
            _dlFallback(blob,fname,ko);
          });
        return;
      }
      L('· A 미지원(canShare=false) → B');
    }catch(e){ L('· A 예외 → B: '+e); }
  } else { L('· A 미지원(Share API 없음) → B'); }

  _dlFallback(blob,fname,ko);
}

function _dlFallback(blob,fname,ko){
  // ── B. Blob URL + <a download> : Android · PC
  //     iOS는 download 속성이 있어도 실제 저장이 안 되므로 건너뛰고 C로 간다
  if(!_isIOS && blob){
    try{
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url; a.download=fname; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ try{document.body.removeChild(a);}catch(e){} URL.revokeObjectURL(url); },4000);
      L('▶ 경로 B: Blob 다운로드 실행');
      return;
    }catch(e){ L('⚠ B 실패 → C: '+e); }
  } else if(_isIOS){ L('· iOS라 B 건너뜀 → C'); }

  // ── C. 새 탭으로 열기 → 길게 눌러 저장
  try{
    var u = blob ? URL.createObjectURL(blob) : state.previewUrl;
    var w = window.open(u,'_blank');
    if(w){
      L('▶ 경로 C: 새 탭 열기 성공');
      alert(ko?'새 창에서 이미지를 길게 눌러 "사진에 저장"을 선택하세요.'
              :'Long-press the image in the new tab and choose "Save to Photos".');
      return;
    }
    L('⚠ C 실패(팝업 차단) → 안내 문구');
  }catch(e){ L('⚠ C 예외 → 안내 문구: '+e); }

  // ── 최종 안내 (무반응 방지)
  alert(ko?'이 브라우저는 자동 저장을 지원하지 않습니다.\n화면의 보고서 이미지를 길게 눌러 "사진에 저장"을 선택하세요.'
          :'This browser does not support automatic saving.\nLong-press the report image above and choose "Save to Photos".');
}

/* ─────────── ★ 이식할 코드 끝 ─────────── */

function toggleLang(){ state.lang = state.lang==='ko'?'en':'ko'; paint(); }
function paint(){ document.getElementById('dlbtn').textContent = dlBtnLabel(state.lang==='ko'); }

/* 데모용 샘플 보고서 캔버스 생성 */
(function(){
  var W=800,H=560, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  var c=cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  c.fillStyle='#1e293b'; c.fillRect(0,0,W,8);
  c.fillStyle='#f59e0b'; c.fillRect(0,8,W,4);
  c.fillStyle='#0f172a'; c.font='bold 22px -apple-system,sans-serif';
  c.fillText('Pre-Work Safety Checklist  (DEMO)',36,52);
  c.fillStyle='#64748b'; c.font='14px -apple-system,sans-serif';
  c.fillText('작업 전 안전 점검 확인서 · 저장 기능 테스트용 샘플',36,78);
  c.fillStyle='#1e293b'; c.fillRect(36,110,W-72,36);
  c.fillStyle='#f1f5f9'; c.font='bold 14px -apple-system,sans-serif';
  c.fillText('  No.   Inspection Item  점검항목',44,134);
  var rows=['안전모·안전화를 착용했나요?','오늘 몸 상태에 이상이 없는지 확인했나요?','비상구·비상연락처 위치를 확인했나요?','세제·소독제의 희석 농도를 확인했나요?','고압세척기 사용 시 보안경을 착용했나요?'];
  for(var i=0;i<rows.length;i++){
    var y=146+i*46;
    if(i%2===0){ c.fillStyle='#f8fafc'; c.fillRect(36,y,W-72,46); }
    c.fillStyle='#334155'; c.font='15px -apple-system,sans-serif';
    c.fillText(String(i+1),56,y+29);
    c.fillText(rows[i],110,y+29);
    c.strokeStyle='#22c55e'; c.lineWidth=2; c.strokeRect(W-90,y+13,20,20);
  }
  c.fillStyle='#94a3b8'; c.font='12px -apple-system,sans-serif';
  c.fillText("Today's Safety | 오늘의안전  ·  "+getDate()+"  ·  DEMO",36,H-24);
  state.previewUrl=cv.toDataURL('image/png');
  document.getElementById('prev').src=state.previewUrl;
  paint();
  document.getElementById('log').textContent =
    '환경 감지\n· iOS 판별: '+_isIOS+
    '\n· navigator.share: '+(!!navigator.share)+
    '\n· navigator.canShare: '+(!!navigator.canShare)+
    '\n· standalone(PWA): '+(window.navigator.standalone===true || window.matchMedia('(display-mode: standalone)').matches)+
    '\n· 이미지 크기: '+Math.round(state.previewUrl.length/1024)+'KB\n──────────';
})();
</script>
</body>
</html>
